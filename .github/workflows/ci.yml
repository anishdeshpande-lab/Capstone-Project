# CI/CD for the Gideon portfolio.
#  - Every pull request: run the checks (lint + browser test suite). Branch protection
#    on main requires both to pass before a PR can be merged.
#  - Every push to main (i.e. a merged PR): run the same checks again, and only if they
#    pass, deploy the site to GitHub Pages.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every JavaScript file parses
        run: for f in js/*.js; do node --check "$f" && echo "ok  $f"; done

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run test suite (normal use + edge cases)
        run: python -m pytest -v

  deploy:
    name: deploy
    needs: [lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Collect only the site's files (no tests or tooling)
        run: |
          mkdir _site
          cp -r index.html css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
